<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Admin Portal - YojanaBasket</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#00113a",
              "primary-container": "#002366",
              "brand-green": "#1e6b37",
              "brand-green-dark": "#145229",
              "brand-green-light": "#eaf5ed",
              secondary: "#8f4e00",
              "secondary-container": "#fe9832",
              background: "#f8f9ff",
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-background text-on-surface font-['Public_Sans',sans-serif] min-h-screen flex flex-col"
  >
    <header
      class="bg-primary text-white shadow-md sticky top-0 z-50 border-b border-primary-container"
    >
      <nav
        class="flex justify-between items-center w-full px-6 py-3.5 max-w-7xl mx-auto"
      >
        <div class="flex items-center gap-3">
          <img
            src="logo.jpeg"
            alt="YojanaBasket"
            class="h-10 w-auto object-contain rounded-lg"
            onerror="this.src = 'icon.jpeg'"
          />
          <div>
            <span class="text-xl font-extrabold tracking-tight"
              >Yojana<span class="text-secondary-container">Basket</span></span
            >
            <span
              class="text-[10px] bg-secondary-container text-primary font-bold px-2 py-0.5 rounded ml-2 uppercase"
              >Admin Portal</span
            >
          </div>
        </div>

        <div id="adminAuthNav" class="flex items-center gap-4">
          <a
            href="/"
            class="text-xs font-bold text-white/80 hover:text-white flex items-center gap-1"
          >
            <span class="material-symbols-outlined text-sm">home</span> Home
          </a>
          <button
            id="adminSignOutBtn"
            onclick="executeAdminSignOut()"
            class="hidden bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-3.5 py-2 rounded-lg transition-all"
          >
            Sign Out Admin
          </button>
        </div>
      </nav>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full px-6 py-8">
      <div
        id="adminLoginCard"
        class="max-w-md mx-auto bg-white rounded-2xl p-8 border border-gray-200 shadow-xl space-y-6 my-12"
      >
        <div class="text-center space-y-2">
          <span class="material-symbols-outlined text-primary text-4xl"
            >admin_panel_settings</span
          >
          <h2 class="text-2xl font-extrabold text-primary">Admin Sign In</h2>
          <p class="text-xs text-gray-500">Authorized personnel access only</p>
        </div>

        <div
          id="adminLoginAlert"
          class="p-3 rounded-lg text-xs font-medium hidden"
        ></div>

        <form onsubmit="executeAdminLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase text-gray-700 mb-1"
              >Username / Email</label
            >
            <input
              type="text"
              id="adminCredential"
              required
              class="w-full rounded-lg border-gray-300 text-sm min-h-[44px]"
              placeholder="e.g. superadmin"
            />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-gray-700 mb-1"
              >Master Password</label
            >
            <input
              type="password"
              id="adminPassword"
              required
              class="w-full rounded-lg border-gray-300 text-sm min-h-[44px]"
              placeholder="••••••••"
            />
          </div>
          <button
            type="submit"
            class="w-full bg-primary text-white font-bold text-xs py-3.5 rounded-xl hover:bg-primary-container transition-all shadow-md min-h-[46px]"
          >
            Authenticate Admin Access
          </button>
        </form>
      </div>

      <div id="adminWorkspace" class="hidden space-y-8">
        <div
          class="bg-primary text-white p-6 rounded-2xl shadow-lg flex justify-between items-center"
        >
          <div>
            <h2 class="text-2xl font-extrabold">Administrative Workspace</h2>
            <p class="text-xs text-white/80 mt-1">
              Publish new government schemes and manage citizen inquiries.
            </p>
          </div>
          <div class="text-right">
            <span
              class="text-xs font-mono bg-white/10 px-3 py-1.5 rounded-lg border border-white/20"
              >Role: SUPER_ADMIN</span
            >
          </div>
        </div>

        <div
          class="bg-white rounded-2xl p-6 border border-gray-200 shadow-sm space-y-6"
        >
          <div class="border-b pb-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-brand-green text-2xl"
                >add_circle</span
              >
              <h3 class="text-lg font-bold text-primary">
                Publish New Government Scheme
              </h3>
            </div>
          </div>

          <div
            id="addSchemeAlert"
            class="p-3 rounded-lg text-xs font-medium hidden"
          ></div>

          <form
            onsubmit="executeAddScheme(event)"
            class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs"
          >
            <div>
              <label class="block font-bold text-gray-700 mb-1"
                >Scheme Name (English) *</label
              >
              <input
                type="text"
                id="schemeName"
                required
                class="w-full rounded-lg border-gray-300 min-h-[42px]"
                placeholder="e.g. PM Surya Ghar Muft Bijli Yojana"
              />
            </div>

            <div>
              <label class="block font-bold text-gray-700 mb-1"
                >Scheme Name (Hindi)</label
              >
              <input
                type="text"
                id="schemeHindiName"
                class="w-full rounded-lg border-gray-300 min-h-[42px]"
                placeholder="e.g. पीएम सूर्य घर मुफ्त बिजली योजना"
              />
            </div>

            <div>
              <label class="block font-bold text-gray-700 mb-1"
                >Welfare Category *</label
              >
              <select
                id="schemeCategory"
                required
                class="w-full rounded-lg border-gray-300 min-h-[42px]"
              >
                <option value="farming">Farming / Agriculture</option>
                <option value="health">Health & Medical Cover</option>
                <option value="loans">
                  Banking, Financial Services & Insurance
                </option>
                <option value="education">Education & Scholarships</option>
                <option value="housing">Housing & Infrastructure</option>
                <option value="public safety">
                  Public Safety, Law and Justice
                </option>
                <option value="transport">Transport</option>
                <option value="sports & culture">Sports & Culture</option>
                <option value="science">
                  Science, Technology & Innovation
                </option>
                <option value="travel">Travel & Tourism</option>
                <option value="Empowerment">
                  Social Welfare & Empowerment
                </option>
                <option value="Women">Women & Child Development</option>
                <option value="sanitation">Utility and Sanitation</option>
                <option value="skills">Skills and Employment</option>
              </select>
            </div>

            <div>
              <label class="block font-bold text-gray-700 mb-1"
                >Ministry / Department *</label
              >
              <input
                type="text"
                id="schemeMinistry"
                required
                class="w-full rounded-lg border-gray-300 min-h-[42px]"
                placeholder="e.g. Ministry of New and Renewable Energy"
              />
            </div>

            <div class="col-span-2">
              <label class="block font-bold text-gray-700 mb-1"
                >Scheme Description *</label
              >
              <textarea
                id="schemeDescription"
                required
                rows="2"
                class="w-full rounded-lg border-gray-300"
                placeholder="Brief summary of scheme objectives..."
              ></textarea>
            </div>

            <div class="col-span-2">
              <label class="block font-bold text-gray-700 mb-1"
                >Citizen Benefits *</label
              >
              <textarea
                id="schemeBenefits"
                required
                rows="2"
                class="w-full rounded-lg border-gray-300"
                placeholder="e.g. Free electricity up to 300 units per month and subsidy up to ₹78,000..."
              ></textarea>
            </div>

            <div>
              <label class="block font-bold text-gray-700 mb-1"
                >Required Documents (Comma Separated)</label
              >
              <input
                type="text"
                id="schemeDocuments"
                class="w-full rounded-lg border-gray-300 min-h-[42px]"
                placeholder="Aadhaar Card, Electricity Bill, Bank Passbook"
              />
            </div>

            <div>
              <label class="block font-bold text-gray-700 mb-1"
                >Official Portal Application Link *</label
              >
              <input
                type="url"
                id="schemeOfficialLink"
                required
                class="w-full rounded-lg border-gray-300 min-h-[42px]"
                placeholder="https://pmsuryaghar.gov.in/"
              />
            </div>

            <div>
              <label class="block font-bold text-gray-700 mb-1"
                >Applicable State / Region *</label
              >
              <select
                id="schemeState"
                required
                class="w-full rounded-lg border-gray-300 min-h-[42px]"
              >
                <option value="central">
                  Central / Nationwide (All States)
                </option>

                <option value="Andhra Pradesh">Andhra Pradesh</option>
                <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                <option value="Assam">Assam</option>
                <option value="Bihar">Bihar</option>
                <option value="Chhattisgarh">Chhattisgarh</option>
                <option value="Goa">Goa</option>
                <option value="Gujarat">Gujarat</option>
                <option value="Haryana">Haryana</option>
                <option value="Himachal Pradesh">Himachal Pradesh</option>
                <option value="Jharkhand">Jharkhand</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Kerala">Kerala</option>
                <option value="Madhya Pradesh">Madhya Pradesh</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="Manipur">Manipur</option>
                <option value="Meghalaya">Meghalaya</option>
                <option value="Mizoram">Mizoram</option>
                <option value="Nagaland">Nagaland</option>
                <option value="Odisha">Odisha</option>
                <option value="Punjab">Punjab</option>
                <option value="Rajasthan">Rajasthan</option>
                <option value="Sikkim">Sikkim</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Telangana">Telangana</option>
                <option value="Tripura">Tripura</option>
                <option value="Uttar Pradesh">Uttar Pradesh</option>
                <option value="Uttarakhand">Uttarakhand</option>
                <option value="West Bengal">West Bengal</option>

                <option value="Andaman and Nicobar Islands">
                  Andaman and Nicobar Islands
                </option>
                <option value="Chandigarh">Chandigarh</option>
                <option value="Dadra and Nagar Haveli and Daman and Diu">
                  Dadra and Nagar Haveli and Daman and Diu
                </option>
                <option value="Delhi">Delhi</option>
                <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                <option value="Ladakh">Ladakh</option>
                <option value="Lakshadweep">Lakshadweep</option>
                <option value="Puducherry">Puducherry</option>
              </select>
            </div>

            <div>
              <label class="block font-bold text-gray-700 mb-1"
                >Gender Scope</label
              >
              <select
                id="schemeGender"
                class="w-full rounded-lg border-gray-300 min-h-[42px]"
              >
                <option value="all">
                  All Citizens (Male, Female, Transgender)
                </option>
                <option value="Female">Female Only</option>
                <option value="Male">Male Only</option>
              </select>
            </div>

            <div class="col-span-2 pt-2">
              <button
                type="submit"
                class="w-full bg-brand-green text-white font-bold text-xs py-3.5 rounded-xl hover:bg-brand-green-dark transition-all shadow flex items-center justify-center gap-2"
              >
                <span class="material-symbols-outlined text-sm">publish</span>
                <span>Publish Scheme to Catalog & AI Database</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        checkAdminSession();
      });

      function checkAdminSession() {
        const token = localStorage.getItem("yojana_admin_token");
        const loginCard = document.getElementById("adminLoginCard");
        const workspace = document.getElementById("adminWorkspace");
        const signOutBtn = document.getElementById("adminSignOutBtn");

        if (token) {
          if (loginCard) loginCard.classList.add("hidden");
          if (workspace) workspace.classList.remove("hidden");
          if (signOutBtn) signOutBtn.classList.remove("hidden");
        } else {
          if (loginCard) loginCard.classList.remove("hidden");
          if (workspace) workspace.classList.add("hidden");
          if (signOutBtn) signOutBtn.classList.add("hidden");
        }
      }

      async function executeAdminLogin(event) {
        event.preventDefault();
        const alertBanner = document.getElementById("adminLoginAlert");
        const credential = document
          .getElementById("adminCredential")
          .value.trim();
        const password = document.getElementById("adminPassword").value;

        try {
          const response = await fetch("/api/auth/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ credential, password }),
          });

          const output = await response.json();

          if (!response.ok) {
            alertBanner.innerText = output.error || "Authentication failed.";
            alertBanner.className =
              "p-3 rounded-lg text-xs font-medium bg-red-50 text-red-700 border border-red-200";
            alertBanner.classList.remove("hidden");
            return;
          }

          localStorage.setItem(
            "yojana_admin_token",
            JSON.stringify(output.adminDetails),
          );
          checkAdminSession();
        } catch (err) {
          alertBanner.innerText =
            "Network connection error logging into admin panel.";
          alertBanner.className =
            "p-3 rounded-lg text-xs font-medium bg-red-50 text-red-700 border border-red-200";
          alertBanner.classList.remove("hidden");
        }
      }

      async function executeAddScheme(event) {
        event.preventDefault();
        const alertBanner = document.getElementById("addSchemeAlert");
        if (alertBanner) alertBanner.classList.add("hidden");

        const docs = document.getElementById("schemeDocuments")?.value;
        const payload = {
          name: document.getElementById("schemeName").value.trim(),
          hindiName:
            document.getElementById("schemeHindiName")?.value.trim() || "",
          category: document.getElementById("schemeCategory").value,
          ministry: document.getElementById("schemeMinistry").value.trim(),
          description: document
            .getElementById("schemeDescription")
            .value.trim(),
          benefits: document.getElementById("schemeBenefits").value.trim(),
          requiredDocuments: docs
            ? docs
                .split(",")
                .map((d) => d.trim())
                .filter(Boolean)
            : ["Aadhaar Card"],
          officialLink: document
            .getElementById("schemeOfficialLink")
            .value.trim(),
          state: document.getElementById("schemeState").value,
          gender: document.getElementById("schemeGender").value,
          caste: ["all"],
          minAge: null,
          maxAge: null,
          maxIncome: null,
          requiresDisability: false,
        };

        try {
          const response = await fetch("/api/admin/schemes/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const output = await response.json();

          if (response.ok) {
            alertBanner.innerText =
              output.message || "Scheme published successfully!";
            alertBanner.className =
              "p-3 rounded-lg text-xs font-medium bg-green-50 text-green-700 border border-green-200";
            alertBanner.classList.remove("hidden");
            event.target.reset();
          } else {
            alertBanner.innerText = output.error || "Failed to publish scheme.";
            alertBanner.className =
              "p-3 rounded-lg text-xs font-medium bg-red-50 text-red-700 border border-red-200";
            alertBanner.classList.remove("hidden");
          }
        } catch (err) {
          alertBanner.innerText =
            "Network connection error publishing scheme. Please check if server is running.";
          alertBanner.className =
            "p-3 rounded-lg text-xs font-medium bg-red-50 text-red-700 border border-red-200";
          alertBanner.classList.remove("hidden");
        }
      }
      function executeAdminSignOut() {
        localStorage.removeItem("yojana_admin_token");
        checkAdminSession();
      }
    </script>
  </body>
</html>
